apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-bhaumik
spec:
  replicas: 1
  selector:
    matchLabels: { app: worker-bhaumik }
  template:
    metadata:
      labels: { app: worker-bhaumik }
    spec:
      containers:
        - name: worker
          image: bhaumik972412/worker-bhaumik:latest
          env:
            - name: REDIS_HOST
              value: redis-bhaumik
            - name: DB_HOST
              value: db-bhaumik
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: db-credentials-bhaumik, key: POSTGRES_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: db-credentials-bhaumik, key: POSTGRES_PASSWORD } }