apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-bhaumik
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis-bhaumik }
  template:
    metadata:
      labels: { app: redis-bhaumik }
    spec:
      containers:
        - name: redis
          image: redis:alpine
          ports: [{ containerPort: 6379 }]
---
apiVersion: v1
kind: Service
metadata:
  name: redis-bhaumik
spec:
  selector: { app: redis-bhaumik }
  ports: [{ port: 6379, targetPort: 6379 }]