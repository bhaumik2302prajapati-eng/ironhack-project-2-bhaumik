name: CI-CD-bhaumik

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: voting-app-cluster-bhaumik

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [vote, result, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}-bhaumik:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}-bhaumik:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name $CLUSTER_NAME --region $AWS_REGION
      - name: Apply manifests
        run: kubectl apply -f K8s/
      - name: Roll out the new images
        run: |
          U=${{ secrets.DOCKERHUB_USERNAME }}
          kubectl set image deployment/vote-bhaumik   vote=$U/vote-bhaumik:${{ github.sha }}
          kubectl set image deployment/result-bhaumik result=$U/result-bhaumik:${{ github.sha }}
          kubectl set image deployment/worker-bhaumik worker=$U/worker-bhaumik:${{ github.sha }}
          kubectl rollout status deployment/vote-bhaumik
          kubectl rollout status deployment/result-bhaumik
          kubectl rollout status deployment/worker-bhaumik